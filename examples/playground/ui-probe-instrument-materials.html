<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Instrument probe: materials over the capture</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--stage, white); color: black; font: 14px system-ui; }
    [hidden] { display: none !important; }
    #frame { position: fixed; inset: 0; }
    #status { position: fixed; right: 8px; bottom: 6px; max-width: 60ch; margin: 0; padding: 4px 8px; border-radius: 6px;
      background: rgb(255 255 255 / 0.85); font: 11px/1.3 system-ui; white-space: pre-wrap; pointer-events: none; z-index: 1; }
    /* Two faceplates, one per theme, each a direct child of the Underglass root (one layer each). Everything on them is
       placed absolutely so the probe's geometry is the same at every DPR. */
    .face { position: absolute; box-sizing: border-box; border-radius: 16px; margin: 0; }
    .face.light { --face: rgb(226, 228, 232); --ink: rgb(28, 30, 36); --muted: rgb(78, 82, 92); --display: rgb(214, 228, 206); --display-ink: rgb(18, 38, 24); }
    .face.dark { --face: rgb(36, 39, 46); --ink: rgb(228, 231, 236); --muted: rgb(170, 175, 186); --display: rgb(8, 16, 20); --display-ink: rgb(116, 226, 246); }
    .face { background: var(--face); color: var(--ink); }
    .face > * { position: absolute; margin: 0; }
    .face h2 { left: 24px; top: 16px; font-size: 14px; line-height: 18px; font-weight: 600; }
    .print { font: 600 11px/14px system-ui; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); text-align: center; }
    .note { font: 12px/16px system-ui; color: var(--muted); }
    /* A printed scale around each knob: 11 ticks over the 270° sweep, on the faceplate inside the knob's box. */
    .scale { border-radius: 50%; pointer-events: none;
      background: repeating-conic-gradient(from -135deg, var(--ink) 0deg 1.6deg, transparent 1.6deg 27deg);
      -webkit-mask: radial-gradient(circle, transparent 0 47px, black 47.5px 51px, transparent 51.5px);
      mask: radial-gradient(circle, transparent 0 47px, black 47.5px 51px, transparent 51.5px); }
    .scale::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--face);
      -webkit-mask: conic-gradient(from 135deg, black 0deg 90deg, transparent 90deg); mask: conic-gradient(from 135deg, black 0deg 90deg, transparent 90deg); }
    /* A mark printed on the face under the glass knob, seen through its lens. */
    .target { border-radius: 50%; pointer-events: none; background:
      radial-gradient(circle, var(--ink) 0 3px, transparent 3.5px),
      repeating-radial-gradient(circle, transparent 0 7px, var(--ink) 7.5px 8.5px, transparent 9px 12px); }
    /* The bright, high-contrast element the reflection test moves next to the chrome dome. */
    .beacon { width: 56px; height: 44px; border-radius: 6px; background: rgb(255, 122, 0); color: rgb(20, 10, 0);
      font: 800 13px/44px system-ui; text-align: center; letter-spacing: 0.08em; }
    /* Face mode for the Instrument level: knobs and the dome paint nothing (they stay native, focusable and
       hit-testable) and meshes draw them. The display paints its backlit window and text; the bezel covers its edge band
       and the glass sits over the window. */
    .face input[type="range"] { appearance: none; margin: 0; padding: 0; background: transparent; outline: none; cursor: pointer; border-radius: 50%; }
    .face input[type="range"]::-webkit-slider-thumb { appearance: none; width: 1px; height: 1px; background: transparent; }
    .face button.dome { appearance: none; margin: 0; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; outline: none; }
    .face input.display { box-sizing: border-box; border: 0; border-radius: 14px; padding: 0 34px; outline: none;
      background: var(--display); color: var(--display-ink); caret-color: var(--display-ink);
      font: 500 40px/96px Consolas, "Cascadia Mono", ui-monospace, monospace; letter-spacing: 0.04em; }
    .face input.display.no-caret { caret-color: transparent; }
  </style>
</head>
<body>
  <div id="frame"></div>
  <pre id="status" role="status"></pre>
  <script type="module" src="/src/ui-probes/instrument-materials.ts"></script>
</body>
</html>
