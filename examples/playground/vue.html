<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Underglass Vue</title>
  <style>
    body { margin: 24px; background: white; color: black; font: 16px system-ui; }
    button, input { font: inherit; }
    [hidden] { display: none !important; }
    #frame { position: relative; width: 640px; height: 420px; background: white; }
    #output, #ordinary { position: absolute; inset: 0; width: 100%; height: 100%; }
    #output { pointer-events: none; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Vue on the core runtime</h1>
  <p>A Vue 3 app through @underglass/vue: original controls updated by Vue reactivity.</p>
  <p><button id="enable">GPU</button> <button id="disable">Ordinary DOM</button> <button id="dispose">Dispose</button></p>
  <div id="frame"><canvas id="output" hidden></canvas><div id="ordinary"></div><div id="overlay"></div></div>
  <pre id="status" role="status"></pre>
  <script type="module" src="/src/demo/vue-demo.ts"></script>
</body>
</html>
