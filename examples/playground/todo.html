<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Underglass TODO application pilot</title>
  <style>
    body { font: 16px system-ui; margin: 24px; color: #182436; background: white; }
    button, input, textarea { font: inherit; }
    [hidden] { display: none !important; }
    #frame { position: relative; width: min(760px, calc(100vw - 48px)); height: 700px; background: white; }
    #capture, #output, #ordinary { position: absolute; inset: 0; width: 100%; height: 100%; }
    #output { pointer-events: none; }
    #status { white-space: pre-wrap; }
    #diagnostic-details pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Task workspace: native list and detail</h1>
  <p>Search, filter, edit notes and confirm deletion. One original React application in DOM and GPU.</p>
  <p><button id="gpu">Enable GPU</button> <button id="dom">Use ordinary DOM</button> <button id="dispose">Dispose app</button></p>
  <pre id="status" role="status" aria-label="Renderer diagnostics">Ordinary DOM by default; GPU requires explicit admission.</pre>
  <details id="diagnostic-details"><summary>Renderer resource details</summary><pre id="ledger"></pre></details>
  <div id="frame"><canvas id="capture" hidden></canvas><canvas id="output" hidden></canvas><div id="ordinary"></div><div id="overlay"></div></div>
  <script type="module" src="/src/demo/todo-demo.tsx"></script>
</body>
</html>
