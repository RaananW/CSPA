<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Strata probe: relief</title>
  <style>
    body { margin: 24px; background: white; color: black; font: 16px system-ui; }
    #stage { display: block; width: 640px; height: 420px; border: 0; }
    /* Face mode: flat faces only. The GPU material pass adds bevels, shadows, light and the focus edge. */
    #face { position: relative; width: 440px; height: 280px; box-sizing: border-box; padding: 20px 24px;
      border-radius: 16px; background: rgb(233, 235, 239); color: rgb(28, 30, 36); font: 15px system-ui; }
    #face h2 { margin: 0 0 12px; font-size: 18px; }
    #face label { display: block; margin: 0 0 6px; }
    #face input[type="text"] { box-sizing: border-box; width: 100%; height: 36px; margin: 0 0 14px; padding: 0 10px;
      border: 0; border-radius: 8px; background: rgb(255, 255, 255); color: rgb(28, 30, 36); font: inherit; outline: none; }
    #face .check { display: flex; align-items: center; gap: 8px; }
    #face input[type="checkbox"] { width: 20px; height: 20px; margin: 0; accent-color: rgb(37, 99, 235); outline: none; }
    #face .row { position: absolute; right: 24px; bottom: 20px; display: flex; gap: 12px; }
    #face button { height: 36px; padding: 0 18px; border: 0; border-radius: 8px; background: rgb(247, 248, 250);
      color: rgb(28, 30, 36); font: 600 15px system-ui; outline: none; cursor: pointer; }
    #face button.accent { background: rgb(37, 99, 235); color: white; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Strata probe P0.2, P0.3, P0.5: relief</h1>
  <p>A panel of native controls in flat face mode. A colour-only material pass lights relief primitives
    (bevels, wells, cast shadows, focus edge) from one key light, and draws the panel's shadow outside its box.
    See <code>docs/ui-library/phase0.md</code>.</p>
  <canvas id="stage" content="drawable"><div id="face" drawable>
    <h2>Account</h2>
    <label for="name">Name</label>
    <input id="name" type="text" value="Ada Lovelace" data-relief="well">
    <label class="check"><input id="news" type="checkbox" data-relief="well"> Send me the newsletter</label>
    <div class="row"><button id="cancel" type="button" data-relief="raised">Cancel</button><button id="save" class="accent" type="button" data-relief="raised">Save</button></div>
  </div></canvas>
  <p><label><input id="material" type="checkbox" checked> Material pass</label></p>
  <pre id="status" role="status"></pre>
  <script type="module" src="/src/ui-probes/relief.ts"></script>
</body>
</html>
