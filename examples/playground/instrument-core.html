<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Underglass core: the instrument material</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: #e3e5e9; color: black; font: 14px system-ui; }
    body[data-theme="dark"] { background: #16181c; }
    [hidden] { display: none !important; }
    /* The stage fills the window; the panels are direct children of the Underglass root (the clipped one inside an
       overflow: hidden viewport). */
    #frame { position: fixed; inset: 0; }
    #status { position: fixed; right: 8px; bottom: 6px; max-width: 46ch; margin: 0; padding: 4px 8px; border-radius: 6px;
      background: rgb(255 255 255 / 0.85); font: 11px/1.3 system-ui; white-space: pre-wrap; pointer-events: none; z-index: 1; }
    .ic-panel { position: absolute; box-sizing: border-box; border-radius: 14px; padding: 12px 16px; margin: 0; }
    .ic-panel h2 { margin: 0 0 8px; font-size: 14px; line-height: 18px; font-weight: 600; }
    #lower { background: rgb(223, 225, 229); color: rgb(28, 30, 36); }
    #upper { background: rgb(42, 45, 52); color: rgb(232, 235, 240); }
    #clipped { background: rgb(200, 206, 214); color: rgb(20, 24, 30); }
    body[data-theme="dark"] #lower { background: rgb(42, 45, 52); color: rgb(226, 230, 236); }
    body[data-theme="dark"] #upper { background: rgb(28, 30, 36); color: rgb(226, 230, 236); }
    body[data-theme="dark"] #clipped { background: rgb(56, 60, 68); color: rgb(226, 230, 236); }
    #viewport { position: absolute; overflow: hidden; }
    .ic-grid { display: grid; justify-content: start; align-content: start; }
    .ic-cell { display: flex; align-items: center; justify-content: center; }
    /* Face mode for the Instrument level: knobs, faders and switches paint nothing themselves (they stay native,
       focusable and hit-testable) and meshes draw them; a key paints its cap face and label, which the captured cap
       shows texel for texel. */
    .ic-panel input[type="range"] { appearance: none; margin: 0; padding: 0; background: transparent; outline: none; cursor: pointer; }
    .ic-panel input[type="range"]::-webkit-slider-thumb { appearance: none; width: 1px; height: 1px; background: transparent; }
    .ic-panel input[data-part="fader"] { writing-mode: vertical-lr; direction: rtl; }
    .ic-panel input[type="checkbox"] { appearance: none; margin: 0; background: transparent; outline: none; cursor: pointer; }
    .ic-panel button { margin: 0; padding: 0; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; outline: none;
      background: rgb(37, 99, 235); color: white; }
    #upper button, body[data-theme="dark"] .ic-panel button { background: rgb(226, 230, 236); color: rgb(24, 26, 32); }
    .ic-panel button:focus-visible { outline: 2px solid rgb(250, 180, 40); outline-offset: -2px; }
  </style>
</head>
<body>
  <div id="frame"></div>
  <pre id="status" role="status"></pre>
  <script type="module" src="/src/instrument-core/page.ts"></script>
</body>
</html>
