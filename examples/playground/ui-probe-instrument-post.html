<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Instrument probe: post chain</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--stage, white); color: black; font: 14px system-ui; }
    [hidden] { display: none !important; }
    /* The stage fills the window; the two panels are direct children of the Underglass root (as on the I0.1 page). */
    #frame { position: fixed; inset: 0; }
    #status { position: fixed; right: 8px; bottom: 6px; max-width: 52ch; margin: 0; padding: 4px 8px; border-radius: 6px;
      background: rgb(255 255 255 / 0.85); font: 11px/1.3 system-ui; white-space: pre-wrap; pointer-events: none; z-index: 1; }
    .instrument-panel { position: absolute; box-sizing: border-box; border-radius: 14px; padding: 12px 16px; margin: 0; }
    .instrument-panel h2 { margin: 0 0 8px; font-size: 14px; line-height: 18px; font-weight: 600; }
    #lower { background: rgb(222, 224, 228); color: rgb(28, 30, 36); }
    #upper { background: rgb(42, 45, 52); color: rgb(232, 235, 240); }
    .instrument-grid { display: grid; justify-content: start; align-content: start; }
    .instrument-cell { position: relative; display: flex; align-items: center; justify-content: center; }
    /* Faceplate print: a label in each cell's bottom-left corner, outside every control's box. */
    .post-label { position: absolute; left: 2px; bottom: 0; font: 600 8px/9px system-ui; letter-spacing: 0.02em; pointer-events: none; white-space: nowrap; }
    /* Face mode for the Instrument level (as on the I0.1 page): knobs, faders, switches, meters and lamps paint
       nothing themselves (they stay native, focusable and hit-testable) and meshes draw them; a key paints its cap
       face and label, which the screen-locked cap shows texel for texel. */
    .instrument-panel input[type="range"] { appearance: none; margin: 0; padding: 0; background: transparent; outline: none; cursor: pointer; }
    .instrument-panel input[type="range"]::-webkit-slider-thumb { appearance: none; width: 1px; height: 1px; background: transparent; }
    .instrument-panel input[data-part="fader"] { writing-mode: vertical-lr; direction: rtl; }
    .instrument-panel input[type="checkbox"] { appearance: none; margin: 0; background: transparent; outline: none; cursor: pointer; }
    .instrument-panel meter { appearance: none; display: block; margin: 0; border: 0; background: transparent; }
    .instrument-panel meter::-webkit-meter-bar { background: transparent; border: 0; }
    .instrument-panel meter::-webkit-meter-optimum-value, .instrument-panel meter::-webkit-meter-suboptimum-value,
    .instrument-panel meter::-webkit-meter-even-less-good-value { background: transparent; }
    .instrument-panel button { margin: 0; padding: 0; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; outline: none;
      background: rgb(37, 99, 235); color: white; }
    #upper button { background: rgb(226, 230, 236); color: rgb(24, 26, 32); }
    .instrument-panel button:focus-visible { outline: 2px solid rgb(250, 180, 40); outline-offset: -2px; }
  </style>
</head>
<body>
  <div id="frame"></div>
  <pre id="status" role="status"></pre>
  <script type="module" src="/src/ui-probes/instrument-post.ts"></script>
</body>
</html>
