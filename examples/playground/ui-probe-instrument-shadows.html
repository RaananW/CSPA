<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Instrument probe: object-on-object shadows</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--stage, white); color: black; font: 14px system-ui; }
    [hidden] { display: none !important; }
    /* The stage fills the window; one panel fills the stage, its controls in cells with their labels. */
    #frame { position: fixed; inset: 0; }
    #status { position: fixed; right: 8px; bottom: 6px; max-width: 60ch; margin: 0; padding: 4px 8px; border-radius: 6px;
      background: rgb(255 255 255 / 0.85); font: 11px/1.3 system-ui; white-space: pre-wrap; pointer-events: none; z-index: 1; }
    #panel { position: absolute; inset: 0; box-sizing: border-box; margin: 0; padding: 34px 16px 12px; background: rgb(222, 224, 228);
      color: rgb(28, 30, 36); }
    #panel h2 { position: absolute; left: 16px; top: 8px; margin: 0; font-size: 14px; line-height: 18px; font-weight: 600; }
    #panel .cells { display: flex; flex-wrap: wrap; align-items: flex-end; align-content: space-evenly; height: 100%;
      gap: var(--row-gap, 24px) var(--column-gap, 40px); }
    /* A label is printed on the faceplate above its control, on the side the key light comes from. */
    #panel .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
    #panel .label { font: 600 10px/12px system-ui; letter-spacing: 0.04em; white-space: nowrap; }
    /* Face mode for the Instrument level: every control paints nothing itself (it stays native, focusable and
       hit-testable) and meshes draw it. Each control's box covers the whole travel of its moving parts. */
    #panel input, #panel button { position: relative; flex: none; box-sizing: border-box; appearance: none; margin: 0; padding: 0;
      border: 0; background: transparent; outline: none; cursor: pointer; }
    #panel input[type="range"]::-webkit-slider-thumb { appearance: none; width: var(--thumb-width, 1px); height: var(--thumb-height, 1px);
      background: transparent; border: 0; }
    #panel input[data-part="fader"] { writing-mode: vertical-lr; direction: rtl; }
  </style>
</head>
<body>
  <div id="frame"></div>
  <pre id="status" role="status"></pre>
  <script type="module" src="/src/ui-probes/instrument-shadows.ts"></script>
</body>
</html>
