<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Instrument probe: moving parts and hits</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--stage, white); color: black; font: 14px system-ui; }
    [hidden] { display: none !important; }
    /* The stage fills the window; one panel fills the stage, so controls reach its corners and edges. */
    #frame { position: fixed; inset: 0; }
    #status { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); max-width: 60ch; margin: 0; padding: 4px 8px;
      border-radius: 6px; background: rgb(255 255 255 / 0.85); font: 11px/1.3 system-ui; white-space: pre-wrap; pointer-events: none; z-index: 1; }
    #panel { position: absolute; inset: 0; box-sizing: border-box; margin: 0; padding: 0; background: rgb(222, 224, 228); color: rgb(28, 30, 36); }
    #panel h2 { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); margin: 0; font-size: 14px; line-height: 18px; font-weight: 600; }
    /* Face mode for the Instrument level: every control paints nothing itself (it stays native, focusable and
       hit-testable) and meshes draw it. Each control's box covers the whole travel of its moving parts. */
    #panel input { position: absolute; box-sizing: border-box; appearance: none; margin: 0; padding: 0; border: 0; background: transparent;
      outline: none; cursor: pointer; }
    #panel input[type="range"]::-webkit-slider-thumb { appearance: none; width: var(--thumb-width, 1px); height: var(--thumb-height, 1px);
      background: transparent; border: 0; }
    #panel input[data-part="fader"] { writing-mode: vertical-lr; direction: rtl; }
  </style>
</head>
<body>
  <div id="frame"></div>
  <pre id="status" role="status"></pre>
  <script type="module" src="/src/ui-probes/instrument-moving.ts"></script>
</body>
</html>
