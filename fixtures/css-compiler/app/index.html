<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="icon" href="data:,"><title>Underglass compiled CSS</title></head>
<body>
<h1>Build-generated CSS animation</h1>
<p>GPU mode requires Chrome Canary with HTML-in-Canvas enabled.</p>
<button id="enable">Enable compiled GPU</button><button id="disable">Ordinary CSS</button><button id="dispose">Dispose</button>
<output id="status">Ordinary DOM</output>
<div id="frame" style="position:relative;width:500px;height:320px">
  <div id="ordinary" style="position:absolute;inset:0"></div>
  <canvas id="capture" hidden style="position:absolute;inset:0;width:100%;height:100%"></canvas>
  <canvas id="gpu" hidden style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
</div>
<script type="module" src="./main.mjs"></script>
</body></html>
