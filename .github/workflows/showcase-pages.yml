name: Deploy example showcase

on:
  push:
    branches: [main]
    paths:
      - "examples/showcase/**"
      - "examples/playground/src/apps/**"
      - "packages/canvas-spa/**"
      - "packages/css-compiler/**"
      - "package-lock.json"
      - ".github/workflows/showcase-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Restore committed tools without browser downloads
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build only the showcase
        env:
          CANVAS_SHOWCASE_BASE: /CSPA/
        run: npm run build:showcase
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: examples/showcase/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
