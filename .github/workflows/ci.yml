name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - name: Install locked dependencies (no browser download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build library and playground
        run: npm run build
      - name: Typecheck library, playground and showcase
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: CSS compiler tests
        run: node --test tests/compiler/*.test.mjs
      - name: Build showcase
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:showcase
      - name: GPU browser suite
        if: always()
        shell: bash
        run: echo "Browser/GPU tests need Chrome Canary with HTML-in-Canvas flags and a GPU; run 'npm run test:browser' locally."
