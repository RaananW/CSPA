name: Private release engineering (build only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Restore exact locked tools (no browser download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix fixtures/react18 --ignore-scripts --no-audit --no-fund
      - name: Validate isolated React peers and exact packages
        run: node scripts/release-validation.mjs build-only
      - name: Explicit capability disposition
        if: always()
        run: echo "Native GPU and browser DOM pilot NOT EXECUTED by hosted build-only lane; this is not release qualification."
